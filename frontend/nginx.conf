# Registra so o caminho (sem query): o callback OAuth leva code/state na query.
log_format path_only '$time_local "$request_method $uri" $status';

# So erros graves: em nivel mais baixo o error.log registraria a linha da requisicao (com a query do OAuth).
error_log /var/log/nginx/error.log crit;

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log path_only;

    # Cabecalhos do design.md (Security headers). Nao declare add_header dentro de
    # location: isso desliga a heranca e as respostas perderiam os cabecalhos.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Mesma origem da SPA e da API (cookies __Host-).
    location /api {
        # Igual ao limite de upload da API (Http:Limits:MaxUploadBytes = 2621440 = 2,5 MB). O padrao do nginx (1 MB)
        # barraria uploads de avatar de 1 a 2,5 MB com 413 sem o corpo de erro da API.
        client_max_body_size 2560k;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
